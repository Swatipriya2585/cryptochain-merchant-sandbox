# CODEOWNERS-style notes
#
# Owner today: sandbox maintainer. This is NOT part of per-commit CI.
#
# Workflow: Sepolia smoke
#   Triggers: nightly cron (03:17 UTC) and workflow_dispatch (run by hand).
#   Job sepolia-smoke — Node 20, npm ci in backend/, then
#     `npm run sepolia:smoke` against a real Sepolia JSON-RPC URL.
#   Why separate: public Sepolia RPCs rate-limit. Hitting them on every
#   push/PR flakes the build. Per-commit CI mocks the provider instead
#   (see .github/workflows/ci.yml).
#
# Does not start Postgres. Does not run the full test suite.

name: Sepolia smoke

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: sepolia-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sepolia-smoke:
    name: sepolia-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
        shell: bash
    env:
      NODE_ENV: sandbox
      PORT: "4000"
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
      SEPOLIA_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
      SEPOLIA_PRIVATE_KEY: "0xe2e495a30f85661a44f619e3bd6e4a91b407435e18d4caa6d1d1ec7315f23640"
      STRIPE_TEST_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_TEST_WEBHOOK_SECRET: whsec_ci_placeholder
      CORS_ORIGIN: http://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Sepolia JSON-RPC smoke
        run: npm run sepolia:smoke

      - name: Surface Sepolia smoke failure
        if: failure()
        run: |
          {
            echo "## Sepolia smoke failed"
            echo
            echo "This job talks to a **real** public Sepolia RPC. Failures are often rate limits, not app bugs."
            echo "Re-run via workflow_dispatch, or swap \`SEPOLIA_RPC_URL\` for a keyed Alchemy/Infura Sepolia endpoint."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Sepolia smoke failed::Open this job and the Sepolia JSON-RPC smoke step for logs."
          exit 1
